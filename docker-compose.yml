services:
  # 1. PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: numiterra-postgis
    environment:
      POSTGRES_USER: numiterra_user
      POSTGRES_PASSWORD: numiterra_password
      POSTGRES_DB: numiterra_db
    ports:
      - "5432:5432"
    volumes:
      - numiterra-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Apache Kafka (KRaft mode - No Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: numiterra-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - numiterra-kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # 3. MinIO (Local S3 compatible storage for images)
  minio:
    image: minio/minio:latest
    container_name: numiterra-minio
    environment:
      MINIO_ROOT_USER: numiterra_admin
      MINIO_ROOT_PASSWORD: numiterra_password
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console UI Port
    command: server /data --console-address ":9001"
    volumes:
      - numiterra-minio-data:/data
    restart: unless-stopped

volumes:
  numiterra-db-data:
  numiterra-kafka-data:
  numiterra-minio-data: