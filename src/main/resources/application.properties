spring.application.name=Numisense-backend

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/numiterra_db
spring.datasource.username=numiterra_user
spring.datasource.password=numiterra_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE / POSTGIS
# ===============================
# Instructs Hibernate to use the PostGIS specific SQL dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Tells Hibernate to VALIDATE that our Kotlin classes match the DB exactly
# We use 'validate' because Flyway handles the actual table creation
spring.jpa.hibernate.ddl-auto=update

# Show SQL in the console (useful for debugging bounding box queries)
spring.jpa.show-sql=true

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=numiterra-backend-group